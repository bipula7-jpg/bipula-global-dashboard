name: Update Market Data

on:
  schedule:
    # Every 30 minutes, 13:00–22:00 UTC, Mon–Fri.
    # That window covers US market hours (9:30am–4:00pm ET) with margin
    # for both EST and EDT — it's an approximation, not exact, since UTC
    # offsets shift with US daylight saving.
    - cron: '*/30 13-22 * * 1-5'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch market data
        run: python scripts/fetch_market_data.py

      - name: Commit changes if any
        run: |
          git config user.name "signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update market data [automated]"
            git push
          fi
